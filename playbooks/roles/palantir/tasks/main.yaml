---
- name: Create palantiri directory
  ansible.builtin.file:
    path: "{{ palantir_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"
  tags: palantiri

- name: Copy palantiri.py
  ansible.builtin.copy:
    src: palantiri.py
    dest: "{{ palantir_dir }}/palantiri.py"
    owner: "{{ ansible_user }}"
    mode: "0755"
  notify: Restart palantiri
  tags: palantiri

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: palantiri.service.j2
    dest: /etc/systemd/system/palantiri.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart palantiri
  tags: palantiri

- name: Enable and start palantiri service
  ansible.builtin.systemd:
    name: palantiri
    enabled: true
    state: started
    daemon_reload: true
  tags: palantiri
