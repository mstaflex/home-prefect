---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install dependencies
  ansible.builtin.apt:
    name:
      - tmux
      - python3
      - python3-venv
      - python3-pip
      - libsm6
      - libxext6
      - libxrender-dev
      - python3-opencv
      - libopenblas0
    state: present

- name: Create virtual environment and install Python dependencies
  ansible.builtin.shell: |
    python3 -m venv --system-site-packages {{ palantir_venv }} --clear

- name: Create virtualenv and install dependencies
  ansible.builtin.pip:
    name:
      - flask
      - requests
      - boto3
      - numpy
      - picamera2
    virtualenv: "{{ palantir_venv }}"
    virtualenv_python: python3

- name: Create palantiri directory
  ansible.builtin.file:
    path: "{{ palantir_dir }}"
    state: directory
    owner: "{{ palantir_user }}"
    mode: "0755"

- name: Copy palantiri.py
  ansible.builtin.copy:
    src: palantiri.py
    dest: "{{ palantir_dir }}/palantiri.py"
    owner: "{{ palantir_user }}"
    mode: "0755"
  notify: Restart palantiri


- name: Deploy systemd service unit
  ansible.builtin.template:
    src: palantiri.service.j2
    dest: /etc/systemd/system/palantiri.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart palantiri

- name: Enable and start palantiri service
  ansible.builtin.systemd:
    name: palantiri
    enabled: true
    state: started
    daemon_reload: true
