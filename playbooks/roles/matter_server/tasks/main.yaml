---

- name: Create matter-server directory
  ansible.builtin.file:
    path: "{{ matter_server_dir }}"
    state: directory
    owner: root
    mode: "0755"
  tags: matter_server

- name: Deploy docker-compose.yaml
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ matter_server_dir }}/docker-compose.yaml"
    mode: "0644"
  tags: matter_server

- name: Deploy matter-server compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ matter_server_dir }}"
    state: present
    pull: always
  tags: matter_server
