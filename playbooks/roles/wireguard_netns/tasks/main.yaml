---
- name: Install wireguard-tools and nftables
  ansible.builtin.apt:
    name:
      - wireguard-tools
      - nftables
    state: present
    update_cache: true
  tags: wireguard

- name: Create /etc/wireguard with strict permissions
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: wireguard

- name: Deploy WireGuard interface config
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart wg-netns
  tags: wireguard

- name: Deploy nftables rules for wgtunnel namespace
  ansible.builtin.template:
    src: nftables-wgtunnel.conf.j2
    dest: /etc/nftables-{{ wg_netns_name }}.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart wg-netns
  tags: wireguard

- name: Deploy host nftables rules
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload host nftables
  tags: wireguard

- name: Enable and start nftables service
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
  tags: wireguard

- name: Persist IP forwarding via sysctl.d
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-wg-forward.conf
    content: "net.ipv4.ip_forward = 1\n"
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl
  tags: wireguard

- name: Deploy namespace setup script
  ansible.builtin.template:
    src: wg-netns-setup.sh.j2
    dest: /usr/local/sbin/wg-netns-setup.sh
    owner: root
    group: root
    mode: "0750"
  notify: Restart wg-netns
  tags: wireguard

- name: Deploy namespace teardown script
  ansible.builtin.template:
    src: wg-netns-teardown.sh.j2
    dest: /usr/local/sbin/wg-netns-teardown.sh
    owner: root
    group: root
    mode: "0750"
  tags: wireguard

- name: Deploy wg-netns systemd service
  ansible.builtin.template:
    src: wg-netns.service.j2
    dest: /etc/systemd/system/wg-netns.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart wg-netns
  tags: wireguard

- name: Enable wg-netns service
  ansible.builtin.systemd:
    name: wg-netns
    enabled: true
    daemon_reload: true
  notify: Restart wg-netns
  tags: wireguard
