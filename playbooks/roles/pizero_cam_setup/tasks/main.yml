---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
  tags: pizero_setup

- name: Install dependencies
  ansible.builtin.apt:
    name:
      - tmux
      - python3
      - python3-venv
      - python3-pip
      - libsm6
      - libxext6
      - libxrender-dev
      - python3-opencv
      - libopenblas0
    state: present
  tags: pizero_setup

- name: Create virtual environment and install Python dependencies
  ansible.builtin.shell: |
    python3 -m venv --system-site-packages {{ palantir_venv }} --clear
  tags: pizero_setup

- name: Create virtualenv and install dependencies
  ansible.builtin.pip:
    name:
      - flask
      - requests
      - boto3
      - numpy
      - picamera2
    virtualenv: "{{ palantir_venv }}"
    virtualenv_python: python3
  tags: pizero_setup
